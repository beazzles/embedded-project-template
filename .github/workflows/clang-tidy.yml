name: Clang-Tidy

on:
    push:
        branches:
            - main
            - develop
    
    pull_request:
        branches:
            - main
            - develop

jobs:
    clang-tidy:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y \
                    build-essential \
                    cmake \
                    ninja-build \
                    pkg-config \
                    libcpputest-dev \
                    clang-tidy
            
            - name: Configure
              run: |
                cmake -S . -B build \
                    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

            - name: Run Clang-Tidy
              run: |
                run-clang-tidy -p build