name: Format Check

on:
    push:
        branches:
            - main
    
    pull_request:
        branches:
            - main

jobs:
    format-check:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install clang-format
              run: |
                sudo apt-get update
                sudo apt-get install -y clang-format

            - name: Check formatting
              run: |
                find . \
                     ( -name "*.c" \
                    -o -name "*.cpp" \
                    -o -name "*.h" \
                    -o -name "*.hpp") \
                    -exec clang-format --dry-run --Werror {} +