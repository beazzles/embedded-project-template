name: Build 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
        -name: Checkout repository 
         uses: actions/checkout@v4

        -name: Install dependencies
         run: | 
            sudo apt-get update 
            sudo apt-get install -y \ 
            build-essential \ 
            cmake \ 
            ninja-build \ 
            pkg-config \ 
            libcpputest-dev 
            
        -name: Configure 
         run: | 
         cmake -S . -B build 
        -name: Build 
         run: | 
            cmake --build build